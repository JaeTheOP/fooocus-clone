name: Build DEFENDR OS UI Package

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Assemble update package
        shell: bash
        run: |
          set -euo pipefail
          package="dist/DEFENDR-OS-3.5.0"
          mkdir -p "$package/assets/css" "$package/assets/js"
          cp assets/css/control-center-3.5.0.css "$package/assets/css/"
          cp assets/js/control-center-3.5.0.js "$package/assets/js/"
          cp apply-ui-3.5.0.php README-3.5.0.md CHANGELOG-3.5.0.md VERSION "$package/"

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: DEFENDR-OS-3.5.0-unified-portal-admin-design
          path: dist/DEFENDR-OS-3.5.0/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
